const $=s=>document.querySelector(s),t=k=>T[L][k],rs=n=>"₹"+n;
const wa=x=>`https://wa.me/${PH}?text=${encodeURIComponent(x)}`;
function save(){try{localStorage.setItem("ss_cart",JSON.stringify(C))}catch(e){}}
function applyText(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("#b-mr").className="px-2.5 py-1.5 "+(L==="mr"?"bg-spice text-white":"text-spice");
  $("#b-en").className="px-2.5 py-1.5 "+(L==="en"?"bg-spice text-white":"text-spice");
  $("#ot").innerHTML=t("ot").map((x,i)=>`<option value="${i}">${x}</option>`).join("");
  otype();
  $("#whyg").innerHTML=t("why").map(x=>`<div class="card p-6 text-center"><div class="text-4xl mb-2">${x[0]}</div><h3 class="font-bold text-maroon mb-1">${x[1]}</h3><p class="text-xs text-gray-600">${x[2]}</p></div>`).join("");
  document.title=t("shop");
}
function otype(){const i=+$("#ot").value;$("#oa").placeholder=t("oa")[i];$("#oa").required=i===2}
function render(){
  const ids=["all","snack","start","main","bread","drink","dess"];
  $("#cats").innerHTML=ids.map(id=>{const n=id==="all"?M.length:M.filter(m=>m[0]===id).length;return `<button onclick="CAT='${id}';render()" class="cat ${CAT===id?"on":"bg-orange-50 text-maroon"} whitespace-nowrap flex justify-between items-center gap-3 px-3.5 py-2 rounded-xl text-sm font-semibold"><span>${T[L].C[id]}</span><span class="text-xs opacity-70">${n}</span></button>`}).join("");
  $("#vf0").textContent=t("veg");$("#vf1").textContent=t("nv");
  [0,1].forEach(i=>$("#vf"+i).className="flex-1 py-1.5 rounded-lg border "+((VEG===(i?0:1))?"bg-maroon text-white border-maroon":"border-orange-200 text-maroon"));
  const list=M.map((m,i)=>[m,i]).filter(([m])=>(CAT==="all"||m[0]===CAT)&&(VEG<0||m[5]===VEG)&&(!Q||(m[2]+m[3]).toLowerCase().includes(Q)));
  $("#empty").classList.toggle("hidden",list.length>0);
  $("#grid").innerHTML=list.map(([m,i])=>{const q=C[i]||0;
    return `<article class="card overflow-hidden flex flex-col">
    <div class="h-32 bg-gradient-to-br from-amber-100 via-orange-50 to-rose-100 flex items-center justify-center text-6xl relative"><span class="drop-shadow-lg">${m[1]}</span>
      <span class="absolute top-3 left-3 ${m[5]?"text-green-600":"text-red-600"} dot"></span>
      ${m[6]?`<span class="absolute top-3 right-3 text-[10px] font-bold bg-gold text-maroon rounded-full px-2.5 py-1">★ ${t("pop")}</span>`:""}</div>
    <div class="p-4 flex-1 flex flex-col gap-1">
      <h3 class="font-bold text-maroon">${L==="mr"?m[3]:m[2]}</h3><p class="text-[11px] text-spice">${L==="mr"?m[2]:m[3]}</p>
      <div class="mt-auto pt-3 flex items-center justify-between"><span class="font-bold text-lg text-maroon">${rs(m[4])}</span>
      ${q?`<div class="flex items-center gap-2 bg-spice text-white rounded-xl font-bold"><button onclick="add(${i},-1)" class="w-9 h-9" aria-label="Minus">−</button><span class="w-5 text-center">${q}</span><button onclick="add(${i},1)" class="w-9 h-9" aria-label="Plus">+</button></div>`
      :`<button onclick="add(${i},1)" class="bg-orange-50 hover:bg-spice hover:text-white text-spice border border-spice font-bold text-sm px-4 py-2 rounded-xl">${t("add")}</button>`}</div>
    </div></article>`}).join("");
  cartUI();
}
function add(i,d){C[i]=(C[i]||0)+d;if(C[i]<=0)delete C[i];$("#done").classList.add("hidden");save();render()}
function total(){return Object.entries(C).reduce((s,[i,q])=>s+M[i][4]*q,0)}
function count(){return Object.values(C).reduce((s,q)=>s+q,0)}
function cartUI(){
  const n=count(),tt=total();
  const b=$("#bdg");b.textContent=n;b.classList.toggle("hidden",!n);b.classList.toggle("flex",!!n);
  const bar=$("#bar");bar.classList.toggle("hidden",!n);bar.classList.toggle("flex",!!n);
  $("#barn").textContent="🛒 "+n+" • "+t("yo");$("#bart").textContent=rs(tt);$("#ft").textContent=rs(tt);
  $("#ci").innerHTML=n?Object.entries(C).map(([i,q])=>{const m=M[i];return `<div class="flex items-center gap-3 border-b border-orange-50 pb-3"><span class="text-3xl">${m[1]}</span><div class="flex-1 min-w-0"><p class="font-semibold text-sm text-maroon truncate">${L==="mr"?m[3]:m[2]}</p><p class="text-xs text-gray-500">${rs(m[4])} × ${q} = <b>${rs(m[4]*q)}</b></p></div><div class="flex items-center gap-2 bg-orange-50 text-spice rounded-lg font-bold"><button onclick="add(${i},-1)" class="w-8 h-8">−</button><span>${q}</span><button onclick="add(${i},1)" class="w-8 h-8">+</button></div></div>`}).join("")+`<div class='text-sm space-y-1 pt-1'><div class='flex justify-between'><span>${t('sub')}</span><span>${rs(calc(cartItems()).s)}</span></div><div class='flex justify-between'><span>${t('gst')}</span><span>${rs(calc(cartItems()).g)}</span></div><div class='flex justify-between font-bold text-maroon text-base'><span>${t('tot')}</span><span>${rs(tt)}</span></div></div>`
  :`<p class="text-sm text-gray-500 text-center py-8">${t("ecart")}</p>`;
  $("#of").classList.toggle("hidden",!n);
}
function drawer(o){$("#dr").classList.toggle("translate-x-full",!o);$("#ov").classList.toggle("hidden",!o)}
function place(e){
  e.preventDefault();if(!count())return;
  const id="SS"+Math.floor(1000+Math.random()*9000),ty=T.en.ot[+$("#ot").value];
  const lines=Object.entries(C).map(([i,q])=>`${q} x ${M[i][2]} - ${rs(M[i][4]*q)}`).join("\n");
  const msg=`*New Order - Swami Samarth Hotel*\nOrder ID: #${id}\nType: ${ty}\nName: ${$("#on").value}\nPhone: ${$("#op").value}\n${T.en.oa[+$("#ot").value].replace(" *","")}: ${$("#oa").value||"-"}\n-----------------\n${lines}\n-----------------\n*Total: ${rs(total())}*`;
  window.open(wa(msg),"_blank");
  C={};save();render();
  const d=$("#done");d.textContent=t("ok")+" #"+id;d.classList.remove("hidden");$("#of").reset();
}
function setLang(l){L=l;try{localStorage.setItem("ss_lang",l)}catch(e){}applyText();render();renderOrders()}
try{const s=localStorage.getItem("ss_lang");if(s==="en"||s==="mr")L=s;const c=JSON.parse(localStorage.getItem("ss_cart")||"{}");Object.keys(c).forEach(k=>{if(M[k]&&c[k]>0)C[k]=c[k]})}catch(e){}
Object.assign(T.mr,{tc:'🛒 कार्ट',to:'📋 माझ्या ऑर्डर',pend:'चालू / प्रलंबित ऑर्डर',dn:'पूर्ण ऑर्डर',st:{pending:'प्रलंबित',prep:'तयार होत आहे',done:'पूर्ण',cancel:'रद्द'},noo:'अजून कोणतीही ऑर्डर नाही.',bl:'बिल',cx:'रद्द करा',sub:'उप-एकूण',gst:'GST (५%)',tot:'एकूण',own:'🔐 मालक पॅनेल',chat:'WhatsApp वर चॅट करा'});
Object.assign(T.en,{tc:'🛒 Cart',to:'📋 My Orders',pend:'Active / Pending Orders',dn:'Completed Orders',st:{pending:'Pending',prep:'Preparing',done:'Completed',cancel:'Cancelled'},noo:'No orders yet.',bl:'Bill',cx:'Cancel',sub:'Subtotal',gst:'GST (5%)',tot:'Total',own:'🔐 Owner Panel',chat:'Chat on WhatsApp'});
let O=[],FL='',OKP=false;const ST=['pending','prep','done','cancel'],NL=String.fromCharCode(10);
try{O=JSON.parse(localStorage.getItem('ss_orders')||'[]')}catch(e){}
const sv=()=>{try{localStorage.setItem('ss_orders',JSON.stringify(O))}catch(e){}};
function calc(a){const s=a.reduce((x,i)=>x+i.p*i.q,0),g=Math.round(s*0.05);return{s:s,g:g,t:s+g}}
function cartItems(){return Object.entries(C).map(([i,q])=>({n:M[i][2],m:M[i][3],p:M[i][4],q:q}))}
function total(){return calc(cartItems()).t}
function drawer(o){$('#dr').classList.toggle('translate-x-full',!o);$('#ov').classList.toggle('hidden',!o);if(o)tab(0);else FL=''}
function tab(n){$('#cv').classList.toggle('hidden',!!n);$('#orv').classList.toggle('hidden',!n);$('#tc').className='py-3 '+(n?'text-gray-500':'text-spice border-b-2 border-spice');$('#to').className='py-3 '+(n?'text-spice border-b-2 border-spice':'text-gray-500');if(n)renderOrders()}
function msgOf(o){return ['*Order - Swami Samarth Hotel*','Order ID: #SS'+o.id,'Type: '+T.en.ot[o.ty],'Name: '+o.nm,'Phone: '+o.ph,T.en.oa[o.ty].replace(' *','')+': '+(o.ad||'-'),'-----------------'].concat(o.it.map(i=>i.q+' x '+i.n+' - '+rs(i.p*i.q)),['-----------------','Subtotal: '+rs(o.s),'GST 5%: '+rs(o.g),'*Total: '+rs(o.t)+'*']).join(NL)}
function place(e){e.preventDefault();if(!count())return;const it=cartItems(),b=calc(it),id=Number(String(Date.now()).slice(-6));
const o={id:id,ts:Date.now(),ty:+$('#ot').value,nm:$('#on').value,ph:$('#op').value,ad:$('#oa').value,it:it,s:b.s,g:b.g,t:b.t,st:'pending'};
O.unshift(o);sv();window.open(wa(msgOf(o)),'_blank');C={};save();$('#of').reset();FL=t('ok')+' #SS'+id;render();tab(1)}
const bt=(c,f,l)=>`<button onclick='${f}' class='px-2.5 py-1.5 rounded-lg ${c}'>${l}</button>`;
const stC={pending:'bg-amber-100 text-amber-800',prep:'bg-blue-100 text-blue-800',done:'bg-green-100 text-green-800',cancel:'bg-gray-200 text-gray-600'};
function ordCard(o,own){const names=o.it.map(i=>i.q+'× '+(L==='mr'?i.m:i.n)).join(', ');
let b=bt('bg-orange-50 text-spice','showBill('+o.id+')',t('bl'));
if(own){if(o.st==='pending')b+=bt('bg-blue-600 text-white','setSt('+o.id+',1)','Start Preparing');if(o.st==='pending'||o.st==='prep')b+=bt('bg-green-600 text-white','setSt('+o.id+',2)','Mark Completed');b+=bt('bg-red-50 text-red-600','delO('+o.id+')','Delete')}
else if(o.st==='pending')b+=bt('bg-red-50 text-red-600','setSt('+o.id+',3)',t('cx'));
return `<div class='border border-orange-100 rounded-2xl p-3 text-xs space-y-1.5 bg-white'><div class='flex justify-between items-center'><b class='text-maroon text-sm'>#SS${o.id}</b><span class='px-2 py-0.5 rounded-full font-bold ${stC[o.st]}'>${t('st')[o.st]}</span></div><p class='text-gray-500'>${new Date(o.ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} • ${t('ot')[o.ty]}${own?' • '+o.nm+' '+o.ph:''}</p><p>${names}</p><div class='flex justify-between items-center pt-1 gap-2'><b class='text-maroon text-sm'>${rs(o.t)}</b><div class='flex flex-wrap justify-end gap-1.5 font-bold'>${b}</div></div></div>`}
const sec=(h,a)=>a.length?`<h4 class='font-bold text-maroon text-sm pt-1'>${h} (${a.length})</h4>`+a.map(o=>ordCard(o,0)).join(''):'';
function renderOrders(){const a=O.filter(o=>o.st==='pending'||o.st==='prep'),d=O.filter(o=>o.st==='done'||o.st==='cancel');
$('#orv').innerHTML=(FL?`<div class='bg-green-50 border border-green-200 text-green-900 rounded-2xl p-3 text-xs'>${FL}</div>`:'')+(O.length?sec(t('pend'),a)+sec(t('dn'),d):`<p class='text-sm text-gray-500 text-center py-8'>${t('noo')}</p>`)}
function ordBadge(){const n=O.filter(o=>o.st==='pending'||o.st==='prep').length,b=$('#ob');b.textContent=n;b.classList.toggle('hidden',!n);b.classList.toggle('flex',!!n)}
function setSt(id,k){const o=O.find(x=>x.id===id);if(o){o.st=ST[k];sv();renderOrders();renderOwner();ordBadge()}}
function delO(id){O=O.filter(x=>x.id!==id);sv();renderOrders();renderOwner();ordBadge()}
function own(o){const m=$('#own');m.classList.toggle('hidden',!o);m.classList.toggle('flex',!!o);if(o&&OKP)renderOwner()}
function unlock(){if($('#pin').value==='1234'){OKP=true;$('#pg').classList.add('hidden');const w=$('#pw');w.classList.remove('hidden');w.classList.add('flex');renderOwner()}else $('#pe').textContent='Wrong PIN'}
function renderOwner(){const p=O.filter(o=>o.st==='pending'||o.st==='prep').length,d=O.filter(o=>o.st==='done'),r={pending:0,prep:1,done:2,cancel:3};
$('#os').innerHTML=[['Pending',p],['Completed',d.length],['Sales',rs(d.reduce((a,o)=>a+o.t,0))]].map(x=>`<div class='bg-white rounded-xl p-2 border'><b class='text-maroon text-base'>${x[1]}</b><br>${x[0]}</div>`).join('');
$('#ol').innerHTML=O.length?O.slice().sort((a,b)=>r[a.st]-r[b.st]).map(o=>ordCard(o,1)).join(''):`<p class='text-sm text-gray-500 text-center py-6'>${t('noo')}</p>`}
function bill(o){const m=$('#bm');m.classList.toggle('hidden',!o);m.classList.toggle('flex',!!o)}
function waBill(id){window.open(wa(msgOf(O.find(x=>x.id===id))),'_blank')}
function showBill(id){const o=O.find(x=>x.id===id);if(!o)return;
$('#bill').innerHTML=`<div class='text-center border-b border-dashed pb-3'><div class='text-3xl'>🍽️</div><h3 class='font-bold text-maroon text-lg'>${T.en.shop} / ${T.mr.shop}</h3><p class='text-xs text-gray-600'>${t('addr')}</p><p class='text-xs text-gray-600'>📞 +91 99608 42249</p></div><div class='text-xs text-gray-600 py-3 space-y-0.5'><p>Bill No: <b>#SS${o.id}</b></p><p>${new Date(o.ts).toLocaleString('en-IN')}</p><p>${o.nm} • ${o.ph}</p><p>${T.en.ot[o.ty]}${o.ad?' • '+o.ad:''}</p></div><table class='w-full text-xs'><tbody>${o.it.map(i=>`<tr class='border-t'><td class='py-1.5'>${i.n}</td><td>${i.q}×${i.p}</td><td class='text-right font-semibold'>${rs(i.p*i.q)}</td></tr>`).join('')}</tbody></table><div class='border-t border-dashed mt-2 pt-2 text-sm space-y-1'><div class='flex justify-between'><span>Subtotal</span><span>${rs(o.s)}</span></div><div class='flex justify-between'><span>GST 5%</span><span>${rs(o.g)}</span></div><div class='flex justify-between font-bold text-maroon text-base'><span>Total</span><span>${rs(o.t)}</span></div></div><p class='text-center text-xs text-gray-500 mt-3'>धन्यवाद! पुन्हा भेट द्या • Thank you, visit again</p><div class='no-print grid grid-cols-3 gap-2 mt-4 text-xs font-bold'><button onclick='waBill(${o.id})' class='bg-green-600 text-white rounded-xl py-2.5'>WhatsApp</button><button onclick='window.print()' class='bg-orange-50 text-spice rounded-xl py-2.5'>Print</button><button onclick='bill(0)' class='bg-gray-100 rounded-xl py-2.5'>Close</button></div>`;bill(1)}
const _cu=cartUI;cartUI=function(){_cu();ordBadge()};
applyText();render();tab(0);
</script>
</body>
</html>
